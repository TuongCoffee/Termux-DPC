plugins {
	id 'com.android.application'
}

android {
	namespace 'com.tuongcoffee.termuxdpc'
	compileSdk 34

	defaultConfig {
		applicationId 'com.tuongcoffee.termuxdpc'
		minSdk 24
		targetSdk 34
		versionCode 1
		versionName '1.0.0'
	}

	signingConfigs {
		debug {
			storeFile file('debug.keystore')
			storePassword 'android'
			keyAlias 'androiddebugkey'
			keyPassword 'android'
		}
	}
}
